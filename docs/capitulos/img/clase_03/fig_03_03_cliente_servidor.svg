<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650">
<style>
text { font-family: Arial, Helvetica, sans-serif; fill:#243447; }
.title { font-size:32px; font-weight:700; fill:#1f4e79; }
.label { font-size:24px; font-weight:700; }
.small { font-size:19px; }
.box { fill:#ffffff; stroke:#319f90; stroke-width:3; rx:18; }
.accent { fill:#fbeae5; stroke:#d35400; stroke-width:3; rx:18; }
.line { stroke:#646464; stroke-width:4; fill:none; }
.arrow { stroke:#646464; stroke-width:4; fill:none; marker-end:url(#arrow); }
</style>
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#646464"/></marker></defs>
<rect width="100%" height="100%" fill="#f8fafb"/>
<text x="60" y="60" class="title">Arquitectura Cliente/Servidor</text>

<rect x="455" y="220" width="290" height="160" class="accent"/><text x="535" y="280" class="label">SERVIDOR</text><text x="485" y="320" class="small">Usuarios · archivos · servicios</text>
<rect x="80" y="120" width="220" height="100" class="box"/><text x="135" y="180" class="label">Cliente 1</text>
<rect x="80" y="430" width="220" height="100" class="box"/><text x="135" y="490" class="label">Cliente 2</text>
<rect x="900" y="120" width="220" height="100" class="box"/><text x="955" y="180" class="label">Cliente 3</text>
<rect x="900" y="430" width="220" height="100" class="box"/><text x="955" y="490" class="label">Cliente 4</text>
<line x1="300" y1="170" x2="455" y2="260" class="arrow"/><line x1="300" y1="480" x2="455" y2="340" class="arrow"/>
<line x1="900" y1="170" x2="745" y2="260" class="arrow"/><line x1="900" y1="480" x2="745" y2="340" class="arrow"/>

</svg>