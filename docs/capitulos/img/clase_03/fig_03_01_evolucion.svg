<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650">
<style>
text { font-family: Arial, Helvetica, sans-serif; fill:#243447; }
.title { font-size:32px; font-weight:700; fill:#1f4e79; }
.label { font-size:24px; font-weight:700; }
.small { font-size:19px; }
.box { fill:#ffffff; stroke:#319f90; stroke-width:3; rx:18; }
.accent { fill:#fbeae5; stroke:#d35400; stroke-width:3; rx:18; }
.line { stroke:#646464; stroke-width:4; fill:none; }
.arrow { stroke:#646464; stroke-width:4; fill:none; marker-end:url(#arrow); }
</style>
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#646464"/></marker></defs>
<rect width="100%" height="100%" fill="#f8fafb"/>
<text x="60" y="60" class="title">Evolución de los Sistemas Operativos de Red</text>

<line x1="110" y1="330" x2="1090" y2="330" class="arrow"/>
<circle cx="150" cy="330" r="18" fill="#319f90"/><text x="115" y="385" class="label">1970</text><text x="105" y="420" class="small">UNIX</text>
<circle cx="340" cy="330" r="18" fill="#319f90"/><text x="305" y="285" class="label">1980</text><text x="250" y="250" class="small">Redes locales</text>
<circle cx="530" cy="330" r="18" fill="#319f90"/><text x="495" y="385" class="label">1990</text><text x="438" y="420" class="small">NetWare / NT</text>
<circle cx="720" cy="330" r="18" fill="#319f90"/><text x="685" y="285" class="label">2000</text><text x="635" y="250" class="small">Linux y directorios</text>
<circle cx="910" cy="330" r="18" fill="#319f90"/><text x="875" y="385" class="label">2010</text><text x="820" y="420" class="small">Virtualización</text>
<circle cx="1060" cy="330" r="18" fill="#d35400"/><text x="1010" y="285" class="label">Actualidad</text><text x="965" y="250" class="small">Nube e híbridos</text>

</svg>