<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650">
<style>
text { font-family: Arial, Helvetica, sans-serif; fill:#243447; }
.title { font-size:32px; font-weight:700; fill:#1f4e79; }
.label { font-size:24px; font-weight:700; }
.small { font-size:19px; }
.box { fill:#ffffff; stroke:#319f90; stroke-width:3; rx:18; }
.accent { fill:#fbeae5; stroke:#d35400; stroke-width:3; rx:18; }
.line { stroke:#646464; stroke-width:4; fill:none; }
.arrow { stroke:#646464; stroke-width:4; fill:none; marker-end:url(#arrow); }
</style>
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#646464"/></marker></defs>
<rect width="100%" height="100%" fill="#f8fafb"/>
<text x="60" y="60" class="title">Triada de la seguridad de la información</text>

<polygon points="600,120 330,500 870,500" fill="#ffffff" stroke="#319f90" stroke-width="5"/>
<circle cx="600" cy="155" r="85" fill="#fbeae5" stroke="#d35400" stroke-width="3"/><text x="515" y="150" class="label">Confidencialidad</text><text x="542" y="185" class="small">Solo autorizados</text>
<circle cx="360" cy="480" r="85" fill="#ffffff" stroke="#319f90" stroke-width="3"/><text x="315" y="470" class="label">Integridad</text><text x="292" y="505" class="small">Datos correctos</text>
<circle cx="840" cy="480" r="85" fill="#ffffff" stroke="#319f90" stroke-width="3"/><text x="775" y="470" class="label">Disponibilidad</text><text x="770" y="505" class="small">Acceso oportuno</text>

</svg>