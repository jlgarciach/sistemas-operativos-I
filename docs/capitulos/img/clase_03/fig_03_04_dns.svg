<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650">
<style>
text { font-family: Arial, Helvetica, sans-serif; fill:#243447; }
.title { font-size:32px; font-weight:700; fill:#1f4e79; }
.label { font-size:24px; font-weight:700; }
.small { font-size:19px; }
.box { fill:#ffffff; stroke:#319f90; stroke-width:3; rx:18; }
.accent { fill:#fbeae5; stroke:#d35400; stroke-width:3; rx:18; }
.line { stroke:#646464; stroke-width:4; fill:none; }
.arrow { stroke:#646464; stroke-width:4; fill:none; marker-end:url(#arrow); }
</style>
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#646464"/></marker></defs>
<rect width="100%" height="100%" fill="#f8fafb"/>
<text x="60" y="60" class="title">¿Qué ocurre cuando utilizamos DNS?</text>

<rect x="70" y="250" width="230" height="120" class="box"/><text x="125" y="305" class="label">Usuario</text><text x="95" y="345" class="small">campus.umg.edu.gt</text>
<rect x="485" y="250" width="230" height="120" class="accent"/><text x="540" y="305" class="label">Servidor DNS</text><text x="525" y="345" class="small">Traduce el nombre</text>
<rect x="900" y="250" width="230" height="120" class="box"/><text x="950" y="305" class="label">Servidor web</text><text x="950" y="345" class="small">Dirección IP</text>
<line x1="300" y1="295" x2="485" y2="295" class="arrow"/><line x1="715" y1="295" x2="900" y2="295" class="arrow"/>
<line x1="900" y1="345" x2="715" y2="345" class="arrow"/><line x1="485" y1="345" x2="300" y2="345" class="arrow"/>

</svg>