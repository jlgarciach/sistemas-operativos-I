<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650">
<style>
text { font-family: Arial, Helvetica, sans-serif; fill:#243447; }
.title { font-size:32px; font-weight:700; fill:#1f4e79; }
.label { font-size:24px; font-weight:700; }
.small { font-size:19px; }
.box { fill:#ffffff; stroke:#319f90; stroke-width:3; rx:18; }
.accent { fill:#fbeae5; stroke:#d35400; stroke-width:3; rx:18; }
.line { stroke:#646464; stroke-width:4; fill:none; }
.arrow { stroke:#646464; stroke-width:4; fill:none; marker-end:url(#arrow); }
</style>
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#646464"/></marker></defs>
<rect width="100%" height="100%" fill="#f8fafb"/>
<text x="60" y="60" class="title">¿Qué ocurre al iniciar sesión?</text>

<rect x="70" y="270" width="180" height="110" class="box"/><text x="105" y="325" class="label">Equipo</text><text x="90" y="360" class="small">Solicita conexión</text>
<rect x="300" y="270" width="180" height="110" class="box"/><text x="345" y="325" class="label">DHCP</text><text x="320" y="360" class="small">Asigna red</text>
<rect x="530" y="270" width="180" height="110" class="box"/><text x="585" y="325" class="label">DNS</text><text x="550" y="360" class="small">Localiza servidor</text>
<rect x="760" y="270" width="180" height="110" class="accent"/><text x="790" y="325" class="label">Directorio</text><text x="790" y="360" class="small">Autentica</text>
<rect x="990" y="270" width="150" height="110" class="box"/><text x="1020" y="325" class="label">Acceso</text><text x="1010" y="360" class="small">Recursos</text>
<line x1="250" y1="325" x2="300" y2="325" class="arrow"/><line x1="480" y1="325" x2="530" y2="325" class="arrow"/><line x1="710" y1="325" x2="760" y2="325" class="arrow"/><line x1="940" y1="325" x2="990" y2="325" class="arrow"/>

</svg>