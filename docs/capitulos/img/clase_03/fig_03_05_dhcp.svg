<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650">
<style>
text { font-family: Arial, Helvetica, sans-serif; fill:#243447; }
.title { font-size:32px; font-weight:700; fill:#1f4e79; }
.label { font-size:24px; font-weight:700; }
.small { font-size:19px; }
.box { fill:#ffffff; stroke:#319f90; stroke-width:3; rx:18; }
.accent { fill:#fbeae5; stroke:#d35400; stroke-width:3; rx:18; }
.line { stroke:#646464; stroke-width:4; fill:none; }
.arrow { stroke:#646464; stroke-width:4; fill:none; marker-end:url(#arrow); }
</style>
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#646464"/></marker></defs>
<rect width="100%" height="100%" fill="#f8fafb"/>
<text x="60" y="60" class="title">Asignación automática mediante DHCP</text>

<rect x="80" y="250" width="250" height="130" class="box"/><text x="130" y="305" class="label">Equipo nuevo</text><text x="110" y="345" class="small">Necesita configuración</text>
<rect x="475" y="200" width="250" height="230" class="accent"/><text x="520" y="260" class="label">Servidor DHCP</text><text x="515" y="310" class="small">IP: 192.168.1.25</text><text x="515" y="345" class="small">Máscara: /24</text><text x="515" y="380" class="small">Gateway y DNS</text>
<rect x="870" y="250" width="250" height="130" class="box"/><text x="920" y="305" class="label">Equipo listo</text><text x="900" y="345" class="small">Conectado a la red</text>
<line x1="330" y1="290" x2="475" y2="290" class="arrow"/><line x1="725" y1="340" x2="870" y2="340" class="arrow"/>

</svg>