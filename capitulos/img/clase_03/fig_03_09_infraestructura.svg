<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650">
<style>
text { font-family: Arial, Helvetica, sans-serif; fill:#243447; }
.title { font-size:32px; font-weight:700; fill:#1f4e79; }
.label { font-size:24px; font-weight:700; }
.small { font-size:19px; }
.box { fill:#ffffff; stroke:#319f90; stroke-width:3; rx:18; }
.accent { fill:#fbeae5; stroke:#d35400; stroke-width:3; rx:18; }
.line { stroke:#646464; stroke-width:4; fill:none; }
.arrow { stroke:#646464; stroke-width:4; fill:none; marker-end:url(#arrow); }
</style>
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#646464"/></marker></defs>
<rect width="100%" height="100%" fill="#f8fafb"/>
<text x="60" y="60" class="title">Infraestructura simplificada de una universidad</text>

<rect x="500" y="90" width="200" height="90" class="accent"/><text x="545" y="145" class="label">Internet</text>
<rect x="500" y="240" width="200" height="90" class="box"/><text x="535" y="295" class="label">Firewall</text>
<rect x="80" y="430" width="230" height="110" class="box"/><text x="115" y="480" class="label">DNS / DHCP</text><text x="120" y="515" class="small">Configuración de red</text>
<rect x="485" y="430" width="230" height="110" class="box"/><text x="520" y="480" class="label">Directorio</text><text x="520" y="515" class="small">Usuarios y grupos</text>
<rect x="890" y="430" width="230" height="110" class="box"/><text x="945" y="480" class="label">Web / BD</text><text x="915" y="515" class="small">Aplicaciones institucionales</text>
<line x1="600" y1="180" x2="600" y2="240" class="arrow"/><line x1="600" y1="330" x2="195" y2="430" class="arrow"/><line x1="600" y1="330" x2="600" y2="430" class="arrow"/><line x1="600" y1="330" x2="1005" y2="430" class="arrow"/>

</svg>