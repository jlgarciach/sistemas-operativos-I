<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650">
<style>
text { font-family: Arial, Helvetica, sans-serif; fill:#243447; }
.title { font-size:32px; font-weight:700; fill:#1f4e79; }
.label { font-size:24px; font-weight:700; }
.small { font-size:19px; }
.box { fill:#ffffff; stroke:#319f90; stroke-width:3; rx:18; }
.accent { fill:#fbeae5; stroke:#d35400; stroke-width:3; rx:18; }
.line { stroke:#646464; stroke-width:4; fill:none; }
.arrow { stroke:#646464; stroke-width:4; fill:none; marker-end:url(#arrow); }
</style>
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#646464"/></marker></defs>
<rect width="100%" height="100%" fill="#f8fafb"/>
<text x="60" y="60" class="title">Roles de servidor en una organización</text>

<rect x="470" y="250" width="260" height="140" class="accent"/><text x="530" y="310" class="label">Infraestructura</text><text x="515" y="350" class="small">Servicios coordinados</text>
<rect x="70" y="105" width="260" height="100" class="box"/><text x="120" y="165" class="label">DNS / DHCP</text>
<rect x="70" y="450" width="260" height="100" class="box"/><text x="115" y="510" class="label">Archivos</text>
<rect x="870" y="105" width="260" height="100" class="box"/><text x="920" y="165" class="label">Directorio</text>
<rect x="870" y="450" width="260" height="100" class="box"/><text x="925" y="510" class="label">Web / BD</text>
<line x1="330" y1="155" x2="470" y2="280" class="arrow"/><line x1="330" y1="500" x2="470" y2="360" class="arrow"/>
<line x1="870" y1="155" x2="730" y2="280" class="arrow"/><line x1="870" y1="500" x2="730" y2="360" class="arrow"/>

</svg>